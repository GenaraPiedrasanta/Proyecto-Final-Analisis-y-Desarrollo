<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema - Cabeza de Algodón</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                        url('https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 1100px;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .header-title h1 {
            color: #0f172a;
            font-size: 2rem;
            font-weight: 700;
        }

        .header-title p {
            color: #64748b;
            font-size: 1rem;
            margin-top: 4px;
        }

        .btn-logout {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
        }

        .section-title {
            color: #334155;
            font-size: 1.25rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card-btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #1e293b;
            font-weight: 600;
            font-size: 1.05rem;
            text-decoration: none;
        }

        .card-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.12);
            border-color: #2563eb;
            color: #2563eb;
        }

        .card-btn span {
            font-size: 2rem;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <div class="header-title">
                <h1>Cabeza de Algodón</h1>
                <p>Sistema de Administración del Asilo</p>
            </div>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>

        <h2 class="section-title">Menú Principal</h2>

        <div class="grid-menu">
            <a href="pacientes.html" class="card-btn">
                <span>👴</span> Pacientes
            </a>
            <a href="familiares.html" class="card-btn">
                <span>👨‍👩‍👧</span> Familiares
            </a>
            <a href="medicos.html" class="card-btn">
                <span>🩺</span> Médicos
            </a>
            <a href="solicitudes.html" class="card-btn">
                <span>📋</span> Solicitudes Médicas
            </a>
            <a href="citas.html" class="card-btn">
                <span>📅</span> Citas Médicas
            </a>
            <a href="historial.html" class="card-btn">
                <span>📁</span> Historial Médico
            </a>
            <a href="laboratorio.html" class="card-btn">
                <span>🔬</span> Laboratorio
            </a>
            <a href="farmacia.html" class="card-btn">
                <span>💊</span> Farmacia
            </a>
            <a href="finanzas.html" class="card-btn">
                <span>💰</span> Finanzas y Caja
            </a>
            <a href="reportes.html" class="card-btn">
                <span>📊</span> Reportes
            </a>
        </div>
    </div>

    <script>
        function cerrarSesion() {
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
