<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes - Cabeza de Algodón</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                        url('https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 1100px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { color: #0f172a; }
        .btn {
            background-color: #2563eb; color: white; border: none; padding: 10px 18px;
            border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none;
        }
        .btn:hover { background-color: #1d4ed8; }
        .btn-sec { background-color: #64748b; }
        .btn-sec:hover { background-color: #475569; }
        
        .form-card {
            background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px;
            border-radius: 12px; margin-bottom: 30px;
        }
        .form-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px;
        }
        input, select {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #0f172a; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Gestión de Pacientes (Internos)</h1>
            <a href="inicio.html" class="btn btn-sec">← Volver al Menú</a>
        </div>

        <!-- Formulario de Registro -->
        <div class="form-card">
            <h3>Registrar Nuevo Paciente</h3>
            <form id="formPaciente">
                <div class="form-grid">
                    <div>
                        <label>Nombre del Paciente:</label>
                        <input type="text" id="nombre" required>
                    </div>
                    <div>
                        <label>Edad:</label>
                        <input type="number" id="edad" required>
                    </div>
                    <div>
                        <label>Psicopatología (si aplica):</label>
                        <input type="text" id="psicopatologia" placeholder="Ej. Demencia senil">
                    </div>
                    <div>
                        <label>Medicamentos de Cajón:</label>
                        <input type="text" id="medicamentos" placeholder="Ej. Losartán 50mg">
                    </div>
                    <div>
                        <label>Familiar Responsable:</label>
                        <select id="id_familiar">
                            <option value="">Sin familiar asignado</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn" style="margin-top: 15px;">Guardar Paciente</button>
            </form>
        </div>

        <!-- Tabla de Pacientes -->
        <h3>Listado de Internos</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Edad</th>
                    <th>Psicopatología</th>
                    <th>Medicamentos</th>
                    <th>Familiar Responsable</th>
                </tr>
            </thead>
            <tbody id="tablaPacientes">
                <!-- Se llena con JS -->
            </tbody>
        </table>
    </div>

    <script>
        // Cargar datos al abrir la página
        document.addEventListener('DOMContentLoaded', () => {
            cargarFamiliares();
            cargarPacientes();
        });

        async function cargarFamiliares() {
            const res = await fetch('http://localhost:3000/api/familiares');
            const familiares = await res.json();
            const select = document.getElementById('id_familiar');
            select.innerHTML = '<option value="">Sin familiar asignado</option>';
            familiares.forEach(f => {
                select.innerHTML += `<option value="${f.id_familiar}">${f.nombre} (${f.telefono})</option>`;
            });
        }

        async function cargarPacientes() {
            const res = await fetch('http://localhost:3000/api/pacientes');
            const pacientes = await res.json();
            const tbody = document.getElementById('tablaPacientes');
            tbody.innerHTML = '';
            pacientes.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.id_paciente}</td>
                        <td><b>${p.nombre}</b></td>
                        <td>${p.edad} años</td>
                        <td>${p.psicopatologia || 'Ninguna'}</td>
                        <td>${p.medicamentos_cajon || 'Ninguno'}</td>
                        <td>${p.nombre_familiar ? p.nombre_familiar + ' (' + p.telefono_familiar + ')' : 'N/A'}</td>
                    </tr>
                `;
            });
        }

        document.getElementById('formPaciente').addEventListener('submit', async (e) => {
            e.preventDefault();
            const datos = {
                nombre: document.getElementById('nombre').value,
                edad: document.getElementById('edad').value,
                psicopatologia: document.getElementById('psicopatologia').value,
                medicamentos_cajon: document.getElementById('medicamentos').value,
                id_familiar: document.getElementById('id_familiar').value || null
            };

            const res = await fetch('http://localhost:3000/api/pacientes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });

            if (res.ok) {
                alert('Paciente registrado con éxito');
                document.getElementById('formPaciente').reset();
                cargarPacientes();
            } else {
                alert('Error al guardar el paciente');
            }
        });
    </script>
</body>
</html>
