<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas y Caja - Cabeza de Algodón</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                        url('https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover; min-height: 100vh; padding: 30px 20px; display: flex; justify-content: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); width: 100%; max-width: 1100px;
            border-radius: 16px; padding: 30px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { color: #0f172a; }
        .btn { background-color: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .btn:hover { background-color: #1d4ed8; }
        .btn-sec { background-color: #64748b; }
        .btn-sec:hover { background-color: #475569; }
        .form-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 12px; margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; background: white; font-family: inherit; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #0f172a; color: white; }
        
        .badge-ingreso { background: #dcfce7; color: #15803d; padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 13px; }
        .badge-egreso { background: #fee2e2; color: #b91c1c; padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 13px; }

        .toast {
            display: none; position: fixed; top: 20px; right: 20px;
            background-color: #10b981; color: white; padding: 14px 24px;
            border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            font-weight: 600; z-index: 1000; animation: fadeIn 0.3s ease;
        }
        .toast.error { background-color: #ef4444; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>

    <div class="container">
        <div class="header">
            <h1>Finanzas y Caja</h1>
            <a href="inicio.html" class="btn btn-sec">← Volver al Menú</a>
        </div>

        <div class="form-card">
            <h3>Registrar Movimiento de Caja</h3>
            <form id="formFinanzas">
                <div class="form-grid">
                    <div>
                        <label>Tipo de Movimiento:</label>
                        <select id="tipo" required>
                            <option value="Ingreso">Ingreso (+)</option>
                            <option value="Egreso">Egreso (-)</option>
                        </select>
                    </div>
                    <div>
                        <label>Paciente (Opcional):</label>
                        <select id="id_paciente">
                            <option value="">General / Asilo</option>
                        </select>
                    </div>
                    <div>
                        <label>Monto (Q):</label>
                        <input type="number" step="0.01" id="monto" required min="0.01" placeholder="Ej. 1500.00">
                    </div>
                    <div>
                        <label>Método de Pago:</label>
                        <select id="metodo_pago" required>
                            <option value="Efectivo">Efectivo</option>
                            <option value="Transferencia">Transferencia Bancaria</option>
                            <option value="Tarjeta">Tarjeta de Crédito/Débito</option>
                            <option value="Cheque">Cheque</option>
                        </select>
                    </div>
                    <div>
                        <label>Fecha:</label>
                        <input type="date" id="fecha" required>
                    </div>
                    <div style="grid-column: span 2;">
                        <label>Concepto / Descripción:</label>
                        <input type="text" id="concepto" required placeholder="Ej. Pago de mensualidad de Septiembre, Compra de víveres, etc.">
                    </div>
                </div>
                <button type="submit" class="btn" style="margin-top: 15px;">Guardar Transacción</button>
            </form>
        </div>

        <h3>Historial de Movimientos de Caja</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Tipo</th>
                    <th>Paciente / Entidad</th>
                    <th>Concepto</th>
                    <th>Método</th>
                    <th>Monto</th>
                </tr>
            </thead>
            <tbody id="tablaFinanzas"></tbody>
        </table>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('fecha').valueAsDate = new Date();
            cargarPacientes();
            cargarFinanzas();
        });

        function mostrarToast(mensaje, esError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = esError ? 'toast error' : 'toast';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        async function cargarPacientes() {
            try {
                const resP = await fetch('http://localhost:3000/api/pacientes');
                const pacientes = await resP.json();
                const selectP = document.getElementById('id_paciente');
                selectP.innerHTML = '<option value="">General / Asilo</option>';
                if (Array.isArray(pacientes)) {
                    pacientes.forEach(p => {
                        selectP.innerHTML += `<option value="${p.id_paciente}">${p.nombre}</option>`;
                    });
                }
            } catch (err) {
                console.error('Error cargando pacientes:', err);
            }
        }

        async function cargarFinanzas() {
            try {
                const res = await fetch('http://localhost:3000/api/finanzas');
                const transacciones = await res.json();
                const tbody = document.getElementById('tablaFinanzas');
                tbody.innerHTML = '';

                if (Array.isArray(transacciones)) {
                    transacciones.forEach(f => {
                        const fechaFormateada = new Date(f.fecha).toLocaleDateString('es-GT');
                        const esIngreso = f.tipo === 'Ingreso';
                        const badgeClass = esIngreso ? 'badge-ingreso' : 'badge-egreso';

                        tbody.innerHTML += `
                            <tr>
                                <td>${f.id_transaccion}</td>
                                <td>${fechaFormateada}</td>
                                <td><span class="${badgeClass}">${f.tipo}</span></td>
                                <td><b>${f.nombre_paciente}</b></td>
                                <td>${f.concepto}</td>
                                <td>${f.metodo_pago}</td>
                                <td style="font-weight: bold; color: ${esIngreso ? '#16a34a' : '#dc2626'};">
                                    ${esIngreso ? '+' : '-'} Q ${parseFloat(f.monto).toFixed(2)}
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (error) {
                console.error("Error al cargar finanzas:", error);
            }
        }

        document.getElementById('formFinanzas').addEventListener('submit', async (e) => {
            e.preventDefault();
            const datos = {
                tipo: document.getElementById('tipo').value,
                id_paciente: document.getElementById('id_paciente').value,
                monto: document.getElementById('monto').value,
                metodo_pago: document.getElementById('metodo_pago').value,
                fecha: document.getElementById('fecha').value,
                concepto: document.getElementById('concepto').value
            };

            try {
                const res = await fetch('http://localhost:3000/api/finanzas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                if (res.ok) {
                    mostrarToast('¡Transacción registrada exitosamente!');
                    document.getElementById('formFinanzas').reset();
                    document.getElementById('fecha').valueAsDate = new Date();
                    cargarFinanzas();
                } else {
                    mostrarToast('Error al registrar la transacción', true);
                }
            } catch (error) {
                console.error("Error en la solicitud:", error);
                mostrarToast('Error de conexión con el servidor', true);
            }
        });
    </script>
</body>
</html>
