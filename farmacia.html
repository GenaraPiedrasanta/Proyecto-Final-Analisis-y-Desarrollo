<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia - Cabeza de Algodón</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                        url('https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover; min-height: 100vh; padding: 30px 20px; display: flex; justify-content: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); width: 100%; max-width: 1100px;
            border-radius: 16px; padding: 30px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { color: #0f172a; }
        .btn { background-color: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .btn:hover { background-color: #1d4ed8; }
        .btn-sec { background-color: #64748b; }
        .btn-sec:hover { background-color: #475569; }
        .form-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 12px; margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; background: white; font-family: inherit; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #0f172a; color: white; }
        
        .toast {
            display: none; position: fixed; top: 20px; right: 20px;
            background-color: #10b981; color: white; padding: 14px 24px;
            border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            font-weight: 600; z-index: 1000; animation: fadeIn 0.3s ease;
        }
        .toast.error { background-color: #ef4444; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>

    <div class="container">
        <div class="header">
            <h1>Inventario de Farmacia</h1>
            <a href="inicio.html" class="btn btn-sec">← Volver al Menú</a>
        </div>

        <div class="form-card">
            <h3>Registrar Nuevo Medicamento</h3>
            <form id="formFarmacia">
                <div class="form-grid">
                    <div>
                        <label>Nombre del Medicamento:</label>
                        <input type="text" id="nombre" required placeholder="Ej. Losartán 50mg">
                    </div>
                    <div>
                        <label>Presentación:</label>
                        <select id="presentacion" required>
                            <option value="Tabletas / Pastillas">Tabletas / Pastillas</option>
                            <option value="Jarabe / Solución">Jarabe / Solución</option>
                            <option value="Inyectable">Inyectable</option>
                            <option value="Crema / Pomada">Crema / Pomada</option>
                            <option value="Gotas">Gotas</option>
                        </select>
                    </div>
                    <div>
                        <label>Cantidad en Stock:</label>
                        <input type="number" id="stock" required min="0" placeholder="Ej. 100">
                    </div>
                    <div>
                        <label>Precio Unitario (Q):</label>
                        <input type="number" step="0.01" id="precio_unitario" required min="0" placeholder="Ej. 15.50">
                    </div>
                    <div>
                        <label>Fecha de Vencimiento:</label>
                        <input type="date" id="fecha_vencimiento" required>
                    </div>
                </div>
                <button type="submit" class="btn" style="margin-top: 15px;">Guardar Medicamento</button>
            </form>
        </div>

        <h3>Listado de Medicamentos</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Medicamento</th>
                    <th>Presentación</th>
                    <th>Stock</th>
                    <th>Precio Unitario</th>
                    <th>Vencimiento</th>
                </tr>
            </thead>
            <tbody id="tablaFarmacia"></tbody>
        </table>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', cargarFarmacia);

        function mostrarToast(mensaje, esError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = esError ? 'toast error' : 'toast';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        async function cargarFarmacia() {
            try {
                const res = await fetch('http://localhost:3000/api/farmacia');
                const medicamentos = await res.json();
                const tbody = document.getElementById('tablaFarmacia');
                tbody.innerHTML = '';

                if (Array.isArray(medicamentos)) {
                    medicamentos.forEach(m => {
                        const fechaVenc = m.fecha_vencimiento 
                            ? new Date(m.fecha_vencimiento).toLocaleDateString('es-GT') 
                            : 'N/A';

                        tbody.innerHTML += `
                            <tr>
                                <td>${m.id_medicamento}</td>
                                <td><b>${m.nombre}</b></td>
                                <td>${m.presentacion}</td>
                                <td><span style="font-weight: bold; color: ${m.stock < 10 ? '#dc2626' : '#16a34a'};">${m.stock} unidades</span></td>
                                <td>Q ${parseFloat(m.precio_unitario).toFixed(2)}</td>
                                <td>${fechaVenc}</td>
                            </tr>
                        `;
                    });
                }
            } catch (error) {
                console.error("Error al cargar farmacia:", error);
            }
        }

        document.getElementById('formFarmacia').addEventListener('submit', async (e) => {
            e.preventDefault();
            const datos = {
                nombre: document.getElementById('nombre').value,
                presentacion: document.getElementById('presentacion').value,
                stock: document.getElementById('stock').value,
                precio_unitario: document.getElementById('precio_unitario').value,
                fecha_vencimiento: document.getElementById('fecha_vencimiento').value
            };

            try {
                const res = await fetch('http://localhost:3000/api/farmacia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                if (res.ok) {
                    mostrarToast('¡Medicamento registrado en inventario!');
                    document.getElementById('formFarmacia').reset();
                    cargarFarmacia();
                } else {
                    mostrarToast('Error al registrar el medicamento', true);
                }
            } catch (error) {
                console.error("Error en la solicitud:", error);
                mostrarToast('Error de conexión con el servidor', true);
            }
        });
    </script>
</body>
</html>
